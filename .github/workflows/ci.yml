name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-syntax:
    name: Frontend JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: node --check on docs/assets/*.js
        run: |
          for f in docs/*.js docs/assets/*.js docs/captain/*.js docs/activate/*.js; do
            [ -f "$f" ] || continue
            echo "checking $f"
            node --check "$f"
          done

  # Blocking: the full pytest suite except conformance/, on the Python the
  # project requires (pyproject.toml requires-python), installed from uv.lock.
  # A fresh checkout has no local/ (gitignored), so this job also proves the
  # suite needs only committed files. Policy: tools/tests/README.md "CI".
  python-tests:
    name: Python test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Run tests (conformance excluded)
        run: uv run pytest tools/tests --ignore=tools/tests/conformance -q

  # Non-blocking: conformance/ is red by design until the DATA_DIR path
  # consolidation lands (tools/tests/conformance/README.md). It runs so its
  # failure count stays visible on every PR, but it never fails the build.
  # continue-on-error sits on the STEP, not the job: at job level GitHub still
  # reports the job's check as failed (it only spares the workflow). The
  # pytest result line goes to the job summary so the count is still visible.
  conformance:
    name: Conformance (non-blocking, red by design)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Run conformance tests
        continue-on-error: true
        run: |
          set -o pipefail
          uv run pytest tools/tests/conformance -q 2>&1 | tee conformance.log
      - name: Report conformance count
        if: always()
        run: |
          echo "### Conformance (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 conformance.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
